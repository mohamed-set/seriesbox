name: Update catalog

# Refreshes data/catalog.json from the TVmaze and AniList public APIs every Monday,
# so new and trending series / anime show up in SeriesBox automatically.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update_catalog.mjs
      - name: Commit catalog
        run: |
          git config user.name "seriesbox-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalog.json
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Update catalog from TVmaze + AniList"
          git pull --rebase origin main
          git push
